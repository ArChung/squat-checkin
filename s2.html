<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深蹲俱樂部｜第二季</title>
<meta name="description" content="深蹲俱樂部第二季：每天 40 下，漏一天扣 10 分，夫妻同隊比誰扣最少。">
<meta name="theme-color" content="#0d0d0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="深蹲打卡">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/s2.css">
</head>
<body>

<!-- 印章的毛邊 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
  </filter>
</svg>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <div class="top-row">
    <p class="brand"><span class="brand-zh">深蹲俱樂部</span><span class="brand-s">S2</span></p>
    <div class="tools">
      <button class="icon-btn" id="rulesBtn" type="button" aria-label="規則"><span class="q">?</span></button>
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="音效">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </div>
  <div class="meta" id="mqDate"></div>
  <p class="late hidden" id="mqLate"></p>
  <p class="all-done hidden" id="allDone">全員達成</p>
</header>

<div class="report hidden" id="report"></div>

<section class="hero" id="hero" aria-label="我"></section>

<section class="rules-inline hidden" id="rulesInline" aria-label="第二季規則"></section>

<section class="league" aria-labelledby="stallsTitle">
  <h2 class="sec-label" id="stallsTitle">本週排行</h2>
  <div id="stalls"></div>
</section>

<section class="panel hidden" id="notify">
  <h2 class="panel-title">打卡通知</h2>
  <div id="notifyBody"></div>
</section>

<section class="panel hidden" id="admin">
  <h2 class="panel-title">團主工具</h2>
  <div class="admin-body" id="adminBody"></div>
</section>

<footer class="footer">
  <p>憑良心蓋章</p>
  <a href="index.html">第一季報告 →</a>
</footer>

<!-- 底部面板：蓋章／補蹲／取消／嗆聲 -->
<div class="sheet-wrap hidden" id="sheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <p class="sh-title" id="shTitle"></p>
    <label class="sh-makeup hidden" id="shMakeup">
      <input type="checkbox" id="shMakeupBox">
      <span class="mk-text">補昨天（共蹲 80 下）</span>
      <span class="switch" aria-hidden="true"></span>
    </label>
    <p class="sh-makeup-off hidden" id="shMakeupOff"></p>
    <input class="sh-input hidden" id="shInput" type="text" maxlength="40" autocomplete="off" enterkeyhint="done">
    <button class="sh-confirm" id="shConfirm" type="button">
      <span class="sh-fill" aria-hidden="true"></span>
      <span class="sh-label" id="shLabel"></span>
      <span class="sh-count" id="shCount" aria-hidden="true"></span>
    </button>
    <p class="sh-hint hidden" id="shHint"></p>
    <button class="sh-cancel" id="shCancel" type="button"></button>
  </div>
</div>

<!-- 明日運勢：一張紙 -->
<div class="fortune hidden" id="fortune" role="dialog" aria-modal="true" aria-labelledby="ftKicker">
  <div class="ft-inner">
    <div class="ft-head"><p class="ft-kicker" id="ftKicker"></p><p class="ft-date" id="ftDate"></p></div>
    <div class="ft-slip" id="ftSlip"></div>
    <button class="ft-close" id="ftClose" type="button">收下</button>
  </div>
</div>

<!-- 儀式舞台：規則、扣分、結算、完賽 -->
<div class="stage hidden" id="stage" role="dialog" aria-modal="true">
  <div class="stage-inner" id="stageInner"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/s2/score.js"></script>
<script src="js/s2/colors.js"></script>
<script src="js/s2/sound.js"></script>
<script src="js/s2/demo.js"></script>
<script src="js/s2/fx.js"></script>
<script src="js/s2/app.js"></script>
</body>
</html>
